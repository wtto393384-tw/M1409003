<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="這是一個範例網頁 ">
    <meta name="keywords" content="HTML, CSS, JavaScript, 範例 ">
    <meta http-equiv="refresh" content="30">
    <title>我的第一個練習檔案</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}
header {
    background-color: #4CAF50;
    color: white;
    text-align: center;
    padding: 1em;
}
section {
    padding: 1em;
}
article {
    padding: 1em;
    background-color: #f9f9f9;
}
aside {
    padding: 1em;
    background-color: #e7e7e7;
}
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 1em;
}
nav ul {
    list-style-type: none;
    padding: 0;
}
nav li {
    display: inline;
    margin: 0 10px;
}
nav a {
    text-decoration: none;
    color: #4CAF50;
}
</style>
</head>

<header><h1>2026年3月9日</h1>歡迎來到我的網站</header>
<nav>
<ul>
<li><a href="index.html">首頁</a></li>
<li><a href="https://www.google.com">Google</a></li>
<li><a href="https://www.youtube.com">YouTube</a></li>
</ul>
</nav>

<!-- 以下是主要內容區域的開始 -->
<p>這是第一個段落，用來展示 p 元素的使用方式。</p>
<br>
<p>這是第二個段落。上面的 br 標籤會在兩個段落之間添加一個換行符。</p>

<!-- 水平線分隔線 -->
<hr>

<p>這是第三個段落，在水平線之後。hr 元素可以用來視覺上分隔不同的內容區塊。</p>

<section>這是一個主要內容區塊</section>
<article>這是一篇文章</article>
<aside>側邊欄內容</aside>

<!-- 表格示例 -->
<table border="1">
  <thead>
    <tr>
      <th>姓名</th>
      <th>年齡</th>
      <th>職位</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>王小明</td>
      <td>28</td>
      <td>工程師</td>
    </tr>
    <tr>
      <td>李美麗</td>
      <td>32</td>
      <td>設計師</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="3">資料共 2 筆</td>
    </tr>
  </tfoot>
</table>

<!-- 媒體元素示例 -->
<h2>媒體內容</h2>
<img src="IMG/pic.jpg" alt="示例圖片" width="300" height="200">
<br><br>
<audio controls>
  <source src="example-audio.mp3" type="audio/mpeg">
  您的瀏覽器不支援 audio 元素。
</audio>
<br><br>
<video width="320" height="240" controls>
  <source src="example-video.mp4" type="video/mp4">
  您的瀏覽器不支援 video 元素。
</video>

<!-- 表單示例 -->
<form>
  <label for="username">使用者名稱：</label>
  <input type="text" id="username" name="username" placeholder="請輸入使用者名稱">
  <br><br>
  <label for="email">電子郵件：</label>
  <input type="email" id="email" name="email" placeholder="請輸入電子郵件">
  <br><br>
  <label for="department">部門：</label>
  <select id="department" name="department">
    <option value="">請選擇部門</option>
    <option value="it">資訊部</option>
    <option value="hr">人力資源部</option>
    <option value="sales">銷售部</option>
    <option value="marketing">行銷部</option>
  </select>
  <br><br>
  <label for="comments">備註：</label>
  <textarea id="comments" name="comments" rows="4" cols="50" placeholder="請輸入備註信息"></textarea>
  <br><br>
  <input type="submit" value="提交">
</form>

<footer>changchang版權所有</footer>
</body>
</html>
