<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個練習檔案</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}
header {
    background-color: #4CAF50;
    color: white;
    text-align: center;
    padding: 1em;
}
section {
    padding: 1em;
}
article {
    padding: 1em;
    background-color: #f9f9f9;
}
aside {
    padding: 1em;
    background-color: #e7e7e7;
}
footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 1em;
}
nav ul {
    list-style-type: none;
    padding: 0;
}
nav li {
    display: inline;
    margin: 0 10px;
}
nav a {
    text-decoration: none;
    color: #4CAF50;
}
</style>
</head>

<header><h1>2026年3月9日</h1>歡迎來到我的網站</header>
<nav>
<ul>
<li><a href="https://www.google.com">Google</a></li>
<li><a href="https://www.youtube.com">YouTube</a></li>
</ul>
</nav>

<!-- 以下是主要內容區域的開始 -->
<p>這是第一個段落，用來展示 p 元素的使用方式。</p>
<br>
<p>這是第二個段落。上面的 br 標籤會在兩個段落之間添加一個換行符。</p>

<!-- 水平線分隔線 -->
<hr>

<p>這是第三個段落，在水平線之後。hr 元素可以用來視覺上分隔不同的內容區塊。</p>

<section>這是一個主要內容區塊</section>
<article>這是一篇文章</article>
<aside>側邊欄內容</aside>
<footer>版權所有</footer>
</body>
</html>
